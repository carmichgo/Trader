version: "3.9"

x-common-env: &common-env
  DB_HOST: timescaledb
  DB_PORT: "5432"
  DB_NAME: trader
  DB_USER: trader
  DB_PASSWORD: ${DB_PASSWORD:-trader_secret}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

services:
  # --------------------------------------------------------------------------
  # TimescaleDB (PostgreSQL with time-series extensions)
  # --------------------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: trader-timescaledb
    environment:
      POSTGRES_DB: trader
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trader_secret}
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d trader"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Redis (caching, pub/sub, trader state coordination)
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: trader-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # FastAPI backend
  # --------------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: trader-api
    environment:
      <<: *common-env
      SYSTEM_ENV: production
      SYSTEM_DEBUG: "false"
    ports:
      - "8000:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Trader: Polymarket
  # --------------------------------------------------------------------------
  trader-polymarket:
    build:
      context: ..
      dockerfile: infra/Dockerfile.trader
    container_name: trader-polymarket
    environment:
      <<: *common-env
      TRADER_TYPE: polymarket
      POLYMARKET_API_KEY: ${POLYMARKET_API_KEY:-}
      POLYMARKET_API_SECRET: ${POLYMARKET_API_SECRET:-}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Trader: Crypto
  # --------------------------------------------------------------------------
  trader-crypto:
    build:
      context: ..
      dockerfile: infra/Dockerfile.trader
    container_name: trader-crypto
    environment:
      <<: *common-env
      TRADER_TYPE: crypto
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      BYBIT_API_KEY: ${BYBIT_API_KEY:-}
      BYBIT_API_SECRET: ${BYBIT_API_SECRET:-}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Trader: Stocks
  # --------------------------------------------------------------------------
  trader-stocks:
    build:
      context: ..
      dockerfile: infra/Dockerfile.trader
    container_name: trader-stocks
    environment:
      <<: *common-env
      TRADER_TYPE: stocks
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_API_SECRET: ${ALPACA_API_SECRET:-}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # React dashboard (nginx-served)
  # --------------------------------------------------------------------------
  dashboard:
    build:
      context: ..
      dockerfile: infra/Dockerfile.dashboard
    container_name: trader-dashboard
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Nginx reverse proxy (API + dashboard + WebSocket)
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: trader-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - dashboard
    restart: unless-stopped

volumes:
  timescaledb_data:
  redis_data:
