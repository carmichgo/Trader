# Alembic configuration for the AI Trading System
# Run from project root:  alembic -c migrations/alembic.ini upgrade head

[alembic]
# Path to migration scripts (relative to project root)
script_location = migrations

# Template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# Timezone for migration timestamps
# timezone =

# Max length of characters for the slug field
# truncate_slug_length = 40

# Set to 'true' to run environment-specific offline migrations
# prepend_sys_path = .

# Version locations for branched migration support
# version_locations = %(here)s/bar:%(here)s/bat:migrations/versions

# Version path separator; OS-specific default is used
# version_path_separator = os

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
