# AI-Powered Autonomous Trading System Configuration

goal:
  starting_capital: 10000
  target_capital: 50000
  time_horizon_days: 180

ai:
  provider: anthropic
  screener_model: claude-sonnet-4-20250514
  analyst_model: claude-opus-4-20250514
  strategist_model: claude-opus-4-20250514

  pricing:
    claude-sonnet:
      input_per_million: 3.00
      output_per_million: 15.00
    claude-opus:
      input_per_million: 15.00
      output_per_million: 75.00

  max_daily_inference_cost: 15.00

  strategist_run_time: "06:00"  # UTC
  strategist_rerun_on_drawdown_pct: 5.0

markets:
  polymarket:
    enabled: true
    scan_interval_default: 120
    max_trades_per_day: 20
    execution_mode: paper

  crypto:
    enabled: true
    scan_interval_default: 30
    max_trades_per_day: 100
    execution_mode: paper
    exchanges:
      - name: binance
        enabled: true
      - name: bybit
        enabled: true
    max_leverage: 3

  stocks:
    enabled: true
    scan_interval_default: 300
    max_trades_per_day: 15
    execution_mode: paper
    broker: alpaca
    market_hours:
      open: "09:30"
      close: "16:00"
      timezone: "US/Eastern"
    trade_premarket: false
    trade_afterhours: false

database:
  url: postgresql+asyncpg://trading:password@localhost:5432/trading
  pool_size: 20

redis:
  url: redis://localhost:6379

logging:
  level: INFO
  format: structured
  log_ai_prompts: true
